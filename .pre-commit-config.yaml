repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
      - id: ruff-format
      - id: ruff-check

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        # debian/sqlupdate is vendored verbatim from Debian's salsa packaging
        # (see packages/roundcube/PACKAGING-NOTES.md); it's kept byte-identical
        # to make future diffs against upstream's tool easy, so lint warnings
        # in it aren't ours to fix.
        exclude: ^packages/roundcube/recipe/files/debian/sqlupdate$
