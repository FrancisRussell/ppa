name: Publish to PPA
description: Places a built .deb into gh-pages, regenerates APT metadata, and commits.

inputs:
  version:
    description: Package version (e.g. 0.6.3)
    required: true
  package:
    description: Package name (e.g. lldap)
    required: true
  deb_dir:
    description: Directory containing the built .deb file
    required: true
  pool_subdir:
    description: Pool subdirectory for this package (e.g. l/lldap)
    required: true
  codename:
    description: Distribution codename (e.g. trixie, noble)
    required: true
  arch:
    description: Package architecture (e.g. amd64)
    required: true
  apt_signing_key:
    description: Armored GPG private key for signing APT repo metadata
    required: true
  github_token:
    description: GitHub token for pushing to gh-pages and main
    required: true
  build_hash:
    description: BLAKE2b hash of the build inputs JSON
    required: true
  build_inputs_json:
    description: Canonical build inputs JSON (the build key)
    required: true
  ref:
    description: Source ref (tag or commit) for metadata
    required: true
  dry_run:
    description: Stage APT repo but skip committing and pushing to gh-pages
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: sh
      run: |
        apt-get update
        apt-get install -y --no-install-recommends apt-utils gnupg jq

    - name: Checkout gh-pages
      shell: sh
      run: |
        git lfs install
        REPO_URL="https://x-access-token:${{ inputs.github_token }}@github.com/${{ github.repository }}.git"
        if git clone "$REPO_URL" --branch gh-pages gh-pages-work; then
          echo "GHPAGES_EXISTS=true" >> "$GITHUB_ENV"
        else
          git init gh-pages-work
          cd gh-pages-work
          git remote add origin "$REPO_URL"
          git checkout --orphan gh-pages
          printf 'pool/**/*.deb filter=lfs diff=lfs merge=lfs -text\n' > .gitattributes
          echo "GHPAGES_EXISTS=false" >> "$GITHUB_ENV"
        fi

    - name: Commit and push gh-pages
      shell: bash
      env:
        APT_SIGNING_KEY: ${{ inputs.apt_signing_key }}
        BUILD_HASH: ${{ inputs.build_hash }}
        BUILD_INPUTS_JSON: ${{ inputs.build_inputs_json }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE/gh-pages-work"
        cd gh-pages-work
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        POOL_DIR="pool/${{ inputs.codename }}/main/${{ inputs.pool_subdir }}"
        VERSION_FILE="versions/${{ inputs.codename }}/${{ inputs.arch }}/${{ inputs.package }}.txt"
        BUILD_RECORD="builds/${{ inputs.codename }}/${{ inputs.package }}/${{ inputs.arch }}/${BUILD_HASH}.json"
        COMMIT_MSG="${{ inputs.package }}: package ${{ inputs.version }}"
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        stage() {
          touch .nojekyll
          cp "$GITHUB_WORKSPACE/KEY.asc" KEY.asc

          mkdir -p "$POOL_DIR"
          # Remove debs from previous builds of the same upstream version
          # (i.e. old ppa timestamps). Builds of other upstream versions are kept.
          BUILD_DIR="builds/${{ inputs.codename }}/${{ inputs.package }}/${{ inputs.arch }}"
          if [ -d "$BUILD_DIR" ]; then
            for record in "$BUILD_DIR"/*.json; do
              [ -f "$record" ] || continue
              RECORD_VERSION=$(jq -r '.version' "$record")
              if [ "$RECORD_VERSION" = "${{ inputs.version }}" ]; then
                jq -r '.files[]' "$record" | while IFS= read -r f; do
                  rm -f "$POOL_DIR/$f"
                done
                rm -f "$record"
              fi
            done
          fi
          cp "${{ inputs.deb_dir }}"/*.deb "$POOL_DIR/"
          "$GITHUB_WORKSPACE/scripts/update-repo.sh" . "${{ inputs.arch }}"

          mkdir -p "$(dirname "$VERSION_FILE")"
          echo "${{ inputs.version }}" > "$VERSION_FILE"

          mkdir -p "$(dirname "$BUILD_RECORD")"
          FILES=$(find "${{ inputs.deb_dir }}" -maxdepth 1 \
            \( -name "*.deb" -o -name "*.dsc" -o -name "*.tar.*" \) \
            -printf '%f\n' | sort | jq -Rsc 'split("\n")[:-1]')
          jq -n \
            --argjson build_key "$BUILD_INPUTS_JSON" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$FILES" \
            --arg ref "${{ inputs.ref }}" \
            --arg run_url "$RUN_URL" \
            --arg version "${{ inputs.version }}" \
            '{build_key: $build_key, built_at: $built_at, files: $files, ref: $ref, run_url: $run_url, version: $version}' \
            > "$BUILD_RECORD"

          git add -A
        }

        stage

        if [ "${{ inputs.dry_run }}" = "true" ]; then
          echo "Dry run: skipping gh-pages commit and push"
          exit 0
        fi

        # Retry up to 3 times: if --force-with-lease fails a concurrent publish
        # job has pushed since we cloned. Fetch, reset to the new remote state,
        # and re-stage so the next amend includes both jobs' packages and
        # fully regenerated APT metadata before retrying.
        for attempt in 1 2 3; do
          if [ "$GHPAGES_EXISTS" = "true" ]; then
            git commit --amend -m "$COMMIT_MSG"
            if git push --force-with-lease origin gh-pages; then
              break
            elif [ "$attempt" -lt 3 ]; then
              git fetch origin gh-pages
              git reset --hard origin/gh-pages
              stage
            else
              echo "Failed to push to gh-pages after 3 attempts" >&2
              exit 1
            fi
          else
            git commit -m "$COMMIT_MSG"
            git push origin gh-pages
            break
          fi
        done
