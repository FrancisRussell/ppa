name: Publish to PPA
description: Places a built .deb into gh-pages, regenerates APT metadata, and commits.

inputs:
  version:
    description: Package version (e.g. 0.6.3)
    required: true
  package:
    description: Package name (e.g. lldap)
    required: true
  deb_dir:
    description: Directory containing the built .deb file
    required: true
  pool_subdir:
    description: Pool subdirectory for this package (e.g. l/lldap)
    required: true
  codename:
    description: Distribution codename (e.g. trixie, noble)
    required: true
  arch:
    description: Package architecture (e.g. amd64)
    required: true
  apt_signing_key:
    description: Armored GPG private key for signing APT repo metadata
    required: true
  github_token:
    description: GitHub token for pushing to gh-pages and main
    required: true
  inputs_key_hash:
    description: BLAKE2b hash of the build inputs JSON
    required: true
  inputs_key:
    description: Canonical build inputs JSON (the build key)
    required: true
  inputs_meta:
    description: Build inputs metadata JSON (ref, repo — not part of the build key)
    required: true
  dry_run:
    description: Stage APT repo but skip committing and pushing to gh-pages
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: sh
      run: |
        apt-get update
        apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg jq

    - name: Checkout gh-pages
      shell: sh
      run: |
        REPO_URL="https://x-access-token:${{ inputs.github_token }}@github.com/${{ github.repository }}.git"
        if git clone "$REPO_URL" --branch gh-pages gh-pages-work; then
          echo "GHPAGES_EXISTS=true" >> "$GITHUB_ENV"
        else
          git init gh-pages-work
          cd gh-pages-work
          git remote add origin "$REPO_URL"
          git checkout --orphan gh-pages
          echo "GHPAGES_EXISTS=false" >> "$GITHUB_ENV"
        fi

    - name: Commit and push gh-pages
      shell: bash
      env:
        APT_SIGNING_KEY: ${{ inputs.apt_signing_key }}
        INPUTS_KEY_HASH: ${{ inputs.inputs_key_hash }}
        INPUTS_KEY: ${{ inputs.inputs_key }}
        INPUTS_META: ${{ inputs.inputs_meta }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE/gh-pages-work"
        cd gh-pages-work
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        POOL_DIR="pool/${{ inputs.codename }}/main/${{ inputs.pool_subdir }}"
        BUILD_RECORD="builds/${{ inputs.codename }}/${{ inputs.package }}/${{ inputs.arch }}/${INPUTS_KEY_HASH}.json"
        COMMIT_MSG="${{ inputs.package }}: package ${{ inputs.version }}"
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        stage() {
          touch .nojekyll
          cp "$GITHUB_WORKSPACE/KEY.asc" KEY.asc

          mkdir -p "$POOL_DIR"
          # Drop stale build records for the same upstream version and arch
          # (i.e. old ppa timestamps). Pool files are cleaned up by gc-pool.sh
          # below, which only removes files not referenced by any remaining record
          # across all arches — safe for arch:all debs shared between arch jobs.
          BUILD_DIR="builds/${{ inputs.codename }}/${{ inputs.package }}/${{ inputs.arch }}"
          if [ -d "$BUILD_DIR" ]; then
            for record in "$BUILD_DIR"/*.json; do
              [ -f "$record" ] || continue
              RECORD_VERSION=$(jq -r '.output.meta.upstream_version' "$record")
              if [ "$RECORD_VERSION" = "${{ inputs.version }}" ]; then
                rm -f "$record"
              fi
            done
          fi

          find "${{ inputs.deb_dir }}" -maxdepth 1 \
            \( -name "*.deb" -o -name "*.dsc" -o -name "*.tar.*" \) \
            -exec cp {} "$POOL_DIR/" \;

          mkdir -p "$(dirname "$BUILD_RECORD")"
          FILES=$(find "${{ inputs.deb_dir }}" -maxdepth 1 \
            \( -name "*.deb" -o -name "*.dsc" -o -name "*.tar.*" \) \
            -printf '%f\n' | sort | jq -Rsc 'split("\n")[:-1]')
          PACKAGE_VERSION=$(dpkg-deb -f \
            "$(find "${{ inputs.deb_dir }}" -maxdepth 1 -name "*.deb" | head -1)" Version)
          JQ_EXPR='{inputs: {key: $key, meta: $meta},
            output: {files: $files, meta: {built_at: $built_at,
            run_url: $run_url, upstream_version: $upstream_version,
            package_version: $package_version}}}'
          jq -n \
            --argjson key "$INPUTS_KEY" \
            --argjson meta "$INPUTS_META" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$FILES" \
            --arg run_url "$RUN_URL" \
            --arg upstream_version "${{ inputs.version }}" \
            --arg package_version "$PACKAGE_VERSION" \
            "$JQ_EXPR" \
            > "$BUILD_RECORD"

          "$GITHUB_WORKSPACE/scripts/gc-pool.sh" \
            "builds/${{ inputs.codename }}/${{ inputs.package }}" \
            "$POOL_DIR"

          "$GITHUB_WORKSPACE/scripts/update-repo.sh" . "${{ inputs.arch }}"

          git add -A
        }

        stage

        if [ "${{ inputs.dry_run }}" = "true" ]; then
          echo "Dry run: skipping gh-pages commit and push"
          exit 0
        fi

        # Retry up to 3 times: if a push fails a concurrent publish job has
        # pushed since we cloned. Fetch, reset to the new remote state, and
        # re-stage so the next amend includes both jobs' packages and fully
        # regenerated APT metadata before retrying. The GHPAGES_EXISTS=false
        # path also needs retries in case a concurrent job created gh-pages
        # between our clone and push.
        for attempt in 1 2 3; do
          if [ "$GHPAGES_EXISTS" = "true" ]; then
            git commit --amend -m "$COMMIT_MSG"
            if git push --force-with-lease origin gh-pages; then
              break
            fi
          else
            git commit -m "$COMMIT_MSG"
            if git push origin gh-pages; then
              break
            fi
            GHPAGES_EXISTS=true
          fi

          if [ "$attempt" -lt 3 ]; then
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            stage
          else
            echo "Failed to push to gh-pages after 3 attempts" >&2
            exit 1
          fi
        done
