name: Build pwsafe

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if version unchanged
        type: boolean
        default: false

  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate build matrix
        id: matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ] || \
             [ "${{ github.event_name }}" = "push" ] || \
             [ "${{ github.event_name }}" = "pull_request" ]; then
            FORCE_FLAG="--force"
          fi
          MATRIX=$(scripts/generate_matrix.py pwsafe $FORCE_FLAG)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.matrix != '[]'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    permissions:
      contents: write
    steps:
      - name: Install bootstrap deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs ca-certificates curl jq

      - uses: actions/checkout@v6

      - name: Install packaging tools
        run: |
          apt-get install -y --no-install-recommends \
            dpkg-dev debhelper devscripts libdistro-info-perl equivs

      - name: Install pwsafe build deps
        run: |
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' \
            packages/pwsafe/recipe/files/debian/control

      - name: Clone pwsafe source
        run: |
          REPO=$(echo '${{ matrix.build_inputs_json }}' | jq -r '.repo')
          COMMIT=$(echo '${{ matrix.build_inputs_json }}' | jq -r '.commit')
          git clone "$REPO" src/pwsafe
          git -C src/pwsafe checkout "$COMMIT"

      - name: Get pwsafe version
        id: version
        run: |
          VERSION=$(packages/pwsafe/recipe/get-version.sh src/pwsafe)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package .deb
        run: |
          mkdir -p /tmp/pwsafe-pkg
          ./packages/pwsafe/recipe/build.sh \
            ${{ steps.version.outputs.version }} \
            src/pwsafe \
            /tmp/pwsafe-pkg \
            ${{ matrix.codename }}

      - name: Publish to PPA
        uses: ./.github/actions/publish-ppa
        with:
          version: ${{ steps.version.outputs.version }}
          package: pwsafe
          deb_dir: /tmp/pwsafe-pkg
          pool_subdir: p/pwsafe
          codename: ${{ matrix.codename }}
          arch: ${{ matrix.arch }}
          apt_signing_key: ${{ secrets.APT_SIGNING_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_hash: ${{ matrix.build_hash }}
          build_inputs_json: ${{ matrix.build_inputs_json }}
          ref: ${{ matrix.ref }}
          dry_run: ${{ github.ref != 'refs/heads/main' }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy-site
