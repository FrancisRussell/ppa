name: Build pwsafe

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if version unchanged
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - 'packages/pwsafe/**'
      - 'build-targets.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/pwsafe/**'
      - 'build-targets.yaml'
      - '.github/actions/publish-ppa/**'
      - '.github/actions/build-matrix/**'
      - 'scripts/update-repo.sh'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - name: Get pinned pwsafe commit
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(cat packages/pwsafe/commit)
          RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/nsd20463/pwsafe/commits/"$COMMIT")
          DATE=$(echo "$RESPONSE" | jq -r '.commit.committer.date' | cut -c1-10 | tr -d -)
          if [ -z "$DATE" ] || [ "$DATE" = "null" ]; then
            echo "Failed to fetch commit date for $COMMIT" >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=0.2.2~beta+git${DATE}" >> "$GITHUB_OUTPUT"

      - name: Determine force flag
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FORCE: ${{ inputs.force || 'false' }}
        run: |
          FORCE=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FORCE="$DISPATCH_FORCE"
          elif [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            FORCE=true
          fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"

      - name: Generate build matrix
        id: matrix
        uses: ./.github/actions/build-matrix
        with:
          package: pwsafe
          version: ${{ steps.version.outputs.version }}
          force: ${{ steps.flags.outputs.force }}

  build:
    needs: check
    if: needs.check.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    permissions:
      contents: write
    steps:
      - name: Install bootstrap deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs ca-certificates curl

      - uses: actions/checkout@v6

      - name: Install packaging tools
        run: |
          apt-get install -y --no-install-recommends \
            dpkg-dev debhelper devscripts libdistro-info-perl equivs

      - name: Install pwsafe build deps
        run: |
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' \
            packages/pwsafe/debian/control

      - name: Clone pwsafe source
        run: |
          git clone https://github.com/nsd20463/pwsafe src/pwsafe
          git -C src/pwsafe checkout ${{ needs.check.outputs.commit }}

      - name: Package .deb
        run: |
          mkdir -p /tmp/pwsafe-pkg
          ./packages/pwsafe/build.sh \
            ${{ matrix.version }} \
            src/pwsafe \
            /tmp/pwsafe-pkg \
            ${{ matrix.codename }}

      - name: Publish to PPA
        uses: ./.github/actions/publish-ppa
        with:
          version: ${{ matrix.version }}
          package: pwsafe
          deb_dir: /tmp/pwsafe-pkg
          pool_subdir: p/pwsafe
          codename: ${{ matrix.codename }}
          arch: ${{ matrix.arch }}
          apt_signing_key: ${{ secrets.APT_SIGNING_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: ${{ github.ref != 'refs/heads/main' }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy-site
