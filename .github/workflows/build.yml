name: Build packages

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if version unchanged
        type: boolean
        default: false
      package:
        description: Package to build (leave empty to build all)
        type: string
        required: false

  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ghpages_sha: ${{ steps.matrix.outputs.ghpages_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Install matrix dependencies
        run: |
          python3 -m venv /opt/matrix-venv
          /opt/matrix-venv/bin/pip install rfc8785 pyyaml

      - name: Generate build matrix
        id: matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          MATRIX=$(/opt/matrix-venv/bin/python scripts/generate_matrix.py ${{ inputs.package }} $FORCE_FLAG)
          echo "$MATRIX"
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
          GHPAGES_SHA=$(git ls-remote origin refs/heads/gh-pages 2>/dev/null | cut -f1)
          echo "ghpages_sha=$GHPAGES_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix != '[]'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container }}
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Install bootstrap deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo 'man-db man-db/auto-update boolean false' | debconf-set-selections
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl jq python3 python3-yaml
          # The checkout action's credential helper binary is not accessible
          # from inside the container, so embed the token in the URL directly.
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Parse build config
        id: config
        run: scripts/parse-build-config.py ${{ matrix.package }}

      - name: Install packaging tools
        run: |
          apt-get install -y --no-install-recommends \
            binutils dpkg-dev debhelper devscripts equivs fakeroot libdistro-info-perl sudo

      - name: Install docker CLI
        if: matrix.arch != 'amd64'
        run: apt-get install -y --no-install-recommends docker-cli

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up cross-compilation
        run: |
          # build-essential is conventionally assumed present in any Debian build
          # environment. For cross-builds, crossbuild-essential-<arch> provides the
          # cross-compiler toolchain (and depends on build-essential itself). libc6:<arch>
          # is installed explicitly because crossbuild-essential uses libc6-dev-<arch>-cross
          # (an amd64-arch sysroot stub) rather than the real multiarch libc6:<arch> package;
          # dh_shlibdeps needs the latter to resolve shared library dependencies in
          # cross-compiled binaries.
          apt-get install -y --no-install-recommends build-essential
          BUILD_ARCH=$(dpkg --print-architecture)
          if [ "${{ matrix.arch }}" != "$BUILD_ARCH" ]; then
            dpkg --add-architecture ${{ matrix.arch }}
            apt-get update
            apt-get install -y --no-install-recommends \
              crossbuild-essential-${{ matrix.arch }} \
              libc6:${{ matrix.arch }}
            echo "DEB_HOST_ARCH=${{ matrix.arch }}" >> "$GITHUB_ENV"
          fi

      - name: Install apt build deps
        if: steps.config.outputs.apt_deps != ''
        run: apt-get install -y --no-install-recommends ${{ steps.config.outputs.apt_deps }}

      - name: Install sccache
        if: steps.config.outputs.use_sccache == 'true'
        run: apt-get install -y --no-install-recommends sccache

      - name: Create build user
        run: |
          useradd --create-home --home-dir /home/builduser --shell /bin/sh builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builduser
          echo "SCCACHE_DIR=/home/builduser/.cache/sccache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=/home/builduser/go/pkg/mod" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Restore cargo cache
        if: steps.config.outputs.use_cargo == 'true'
        uses: actions/cache@v5
        with:
          path: |
            /home/builduser/.cargo/registry/index
            /home/builduser/.cargo/registry/cache
            /home/builduser/.cargo/git/db
          key: ${{ matrix.package }}-cargo-${{ matrix.inputs_key_hash }}
          restore-keys: |
            ${{ matrix.package }}-cargo-

      - name: Restore sccache cache
        if: steps.config.outputs.use_sccache == 'true'
        uses: actions/cache/restore@v5
        with:
          path: /home/builduser/.cache/sccache
          key: ${{ matrix.package }}-sccache-${{ matrix.codename }}-${{ matrix.inputs_key_hash }}-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.package }}-sccache-${{ matrix.codename }}-${{ matrix.inputs_key_hash }}-
            ${{ matrix.package }}-sccache-${{ matrix.codename }}-

      - name: Mark sccache entries for pruning
        if: steps.config.outputs.use_sccache == 'true'
        run: |
          SCCACHE_PRUNE_TS=$(date +%s)
          echo "SCCACHE_PRUNE_TS=$SCCACHE_PRUNE_TS" >> "$GITHUB_ENV"
          mkdir -p "$SCCACHE_DIR"
          SCCACHE_COUNT=$(find "$SCCACHE_DIR" -type f | wc -l)
          echo "SCCACHE_COUNT_BEFORE=$SCCACHE_COUNT" >> "$GITHUB_ENV"
          find "$SCCACHE_DIR" -type f -exec touch -m -d "@$SCCACHE_PRUNE_TS" {} +

      - name: Install Node.js
        if: steps.config.outputs.has_node == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.config.outputs.node_version }}

      - name: Clone source
        run: |
          REPO=$(echo '${{ toJSON(matrix.inputs_meta) }}' | jq -r '.repo')
          REF=$(echo '${{ toJSON(matrix.inputs_meta) }}' | jq -r '.ref')
          COMMIT=$(echo '${{ toJSON(matrix.inputs_key) }}' | jq -r '.commit')
          git init src/${{ matrix.package }}
          git -C src/${{ matrix.package }} remote add origin "$REPO"
          FETCH_REFS=("$COMMIT")
          [ "$REF" != "$COMMIT" ] && FETCH_REFS+=("refs/tags/$REF:refs/tags/$REF")
          ATTEMPT=0
          until
            ATTEMPT=$((ATTEMPT + 1))
            git -C src/${{ matrix.package }} fetch --depth 1 --no-tags origin "${FETCH_REFS[@]}"
          do
            FETCH_EXIT=$?
            [ "$FETCH_EXIT" -ne 128 ] && exit "$FETCH_EXIT"
            [ "$ATTEMPT" -ge 3 ] && exit 1
            sleep $((ATTEMPT * 10))
          done
          git -C src/${{ matrix.package }} checkout FETCH_HEAD

      - name: Install Go
        if: steps.config.outputs.has_go == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: src/${{ matrix.package }}/${{ steps.config.outputs.go_version_file }}
          cache: ${{ steps.config.outputs.go_sum_file != '' }}
          cache-dependency-path: src/${{ matrix.package }}/${{ steps.config.outputs.go_sum_file }}

      - name: Get version
        id: version
        run: |
          VERSION=$(packages/${{ matrix.package }}/recipe/get-version.sh src/${{ matrix.package }})
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$'; then
            echo "Invalid Debian upstream version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Chown build user home
        run: chown -R builduser:builduser /home/builduser

      - name: Install rustup
        if: steps.config.outputs.has_rust == 'true'
        run: |
          . scripts/rust-cross-env.sh
          ARGS=(-y --default-toolchain "${{ steps.config.outputs.rust_toolchain }}")
          for c in ${{ steps.config.outputs.rust_components }}; do ARGS+=(--component "$c"); done
          sudo -u builduser -H sh -c \
            "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- ${ARGS[*]}"
          TARGETS=(${{ steps.config.outputs.rust_targets }})
          [ -n "$RUST_TARGET" ] && TARGETS+=("$RUST_TARGET")
          [ ${#TARGETS[@]} -gt 0 ] && sudo -u builduser -H sh -c \
            ". /home/builduser/.cargo/env && rustup target add ${TARGETS[*]}"

      - name: Install Rust cargo tools
        if: steps.config.outputs.cargo_tools != ''
        run: |
          for tool in ${{ steps.config.outputs.cargo_tools }}; do
            sudo -u builduser -H sh -c \
              ". /home/builduser/.cargo/env && cargo install --locked $tool"
          done

      - name: Package .deb
        run: |
          mkdir -p /tmp/pkg
          chown builduser:builduser /tmp/pkg src
          chown -R builduser:builduser src/${{ matrix.package }}
          BUILD_ENV="PATH=$PATH"
          [ -n "${GOTOOLCHAIN:-}" ] && BUILD_ENV="$BUILD_ENV GOTOOLCHAIN=$GOTOOLCHAIN"
          [ -n "${SCCACHE_DIR:-}" ] && BUILD_ENV="$BUILD_ENV SCCACHE_DIR=$SCCACHE_DIR"
          [ -n "${DEB_HOST_ARCH:-}" ] && BUILD_ENV="$BUILD_ENV DEB_HOST_ARCH=$DEB_HOST_ARCH"
          sudo -u builduser -H sh -c \
            "$BUILD_ENV ./packages/${{ matrix.package }}/recipe/build.sh \
              ${{ steps.version.outputs.version }} \
              src/${{ matrix.package }} \
              /tmp/pkg \
              ${{ matrix.codename }}"

      - name: sccache stats
        if: steps.config.outputs.use_sccache == 'true'
        run: sudo -u builduser -H sh -c "SCCACHE_DIR=$SCCACHE_DIR sccache --show-stats"

      - name: Prune sccache and check for changes
        if: steps.config.outputs.use_sccache == 'true'
        run: |
          touch -m -d "@$SCCACHE_PRUNE_TS" /tmp/sccache_prune_ref
          PRUNED=$(find "$SCCACHE_DIR" -type f ! -anewer /tmp/sccache_prune_ref | wc -l)
          find "$SCCACHE_DIR" -type f ! -anewer /tmp/sccache_prune_ref -delete
          SCCACHE_COUNT_AFTER=$(find "$SCCACHE_DIR" -type f 2>/dev/null | wc -l)
          if [ "$SCCACHE_COUNT_AFTER" != "$SCCACHE_COUNT_BEFORE" ] || [ "$PRUNED" -gt 0 ]; then
            echo "SCCACHE_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_CHANGED=false" >> "$GITHUB_ENV"
          fi

      - name: Save sccache cache
        if: steps.config.outputs.use_sccache == 'true' && env.SCCACHE_CHANGED == 'true'
        uses: actions/cache/save@v5
        with:
          path: /home/builduser/.cache/sccache
          key: ${{ matrix.package }}-sccache-${{ matrix.codename }}-${{ matrix.inputs_key_hash }}-${{ github.run_id }}

      - name: Publish to PPA
        uses: ./.github/actions/publish-ppa
        with:
          version: ${{ steps.version.outputs.version }}
          package: ${{ matrix.package }}
          deb_dir: /tmp/pkg
          pool_subdir: ${{ matrix.pool_subdir }}
          codename: ${{ matrix.codename }}
          arch: ${{ matrix.arch }}
          apt_signing_key: ${{ secrets.APT_SIGNING_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          inputs_key_hash: ${{ matrix.inputs_key_hash }}
          inputs_key: ${{ toJSON(matrix.inputs_key) }}
          inputs_meta: ${{ toJSON(matrix.inputs_meta) }}
          dry_run: ${{ github.ref != 'refs/heads/main' }}

  all-builds-passed:
    name: All builds passed
    needs: [generate-matrix, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all builds passed
        run: |
          [ "${{ needs.generate-matrix.result }}" = "success" ] && \
          [ "${{ needs.build.result }}" != "failure" ]

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [generate-matrix, build]
    if: github.ref == 'refs/heads/main' && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Check if any build published to gh-pages
        id: changed
        run: |
          CURRENT_SHA=$(git ls-remote origin refs/heads/gh-pages 2>/dev/null | cut -f1)
          if [ -z "$CURRENT_SHA" ] || [ "$CURRENT_SHA" = "${{ needs.generate-matrix.outputs.ghpages_sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/deploy-site
        if: steps.changed.outputs.changed == 'true'
