name: Build packages

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if version unchanged
        type: boolean
        default: false
      package:
        description: Package to build (leave empty to build all)
        type: string
        required: false

  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Generate build matrix
        id: matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          MATRIX=$(scripts/generate_matrix.py ${{ inputs.package }} $FORCE_FLAG)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.matrix != '[]'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    permissions:
      contents: write
    steps:
      - name: Install bootstrap deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git git-lfs ca-certificates curl jq python3 python3-yaml

      - uses: actions/checkout@v6

      - name: Parse build config
        id: config
        run: scripts/parse-build-config.py ${{ matrix.package }}

      - name: Install packaging tools
        run: |
          apt-get install -y --no-install-recommends \
            dpkg-dev debhelper devscripts libdistro-info-perl

      - name: Install apt build deps
        if: steps.config.outputs.apt_deps != ''
        run: apt-get install -y --no-install-recommends ${{ steps.config.outputs.apt_deps }}

      - name: Install sccache
        if: steps.config.outputs.use_sccache == 'true'
        run: apt-get install -y --no-install-recommends sccache

      - name: Restore cargo cache
        if: steps.config.outputs.use_cargo == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.package }}-cargo-${{ matrix.build_hash }}
          restore-keys: |
            ${{ matrix.package }}-cargo-

      - name: Restore sccache cache
        if: steps.config.outputs.use_sccache == 'true'
        uses: actions/cache/restore@v5
        with:
          path: /github/home/.cache/sccache
          key: ${{ matrix.package }}-sccache-${{ matrix.codename }}-${{ matrix.build_hash }}-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.package }}-sccache-${{ matrix.codename }}-${{ matrix.build_hash }}-
            ${{ matrix.package }}-sccache-${{ matrix.codename }}-

      - name: Mark sccache entries for pruning
        if: steps.config.outputs.use_sccache == 'true'
        run: |
          SCCACHE_PRUNE_TS=$(date +%s)
          echo "SCCACHE_PRUNE_TS=$SCCACHE_PRUNE_TS" >> "$GITHUB_ENV"
          mkdir -p "$SCCACHE_DIR"
          SCCACHE_COUNT=$(find "$SCCACHE_DIR" -type f | wc -l)
          echo "SCCACHE_COUNT_BEFORE=$SCCACHE_COUNT" >> "$GITHUB_ENV"
          find "$SCCACHE_DIR" -type f -exec touch -m -d "@$SCCACHE_PRUNE_TS" {} +

      - name: Install rustup
        if: steps.config.outputs.has_rust == 'true'
        run: |
          ARGS="-y --default-toolchain ${{ steps.config.outputs.rust_toolchain }}"
          for t in ${{ steps.config.outputs.rust_targets }};     do ARGS="$ARGS --target $t";    done
          for c in ${{ steps.config.outputs.rust_components }};  do ARGS="$ARGS --component $c"; done
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- $ARGS

      - name: Install Rust cargo tools
        if: steps.config.outputs.cargo_tools != ''
        run: |
          . "$HOME/.cargo/env"
          for tool in ${{ steps.config.outputs.cargo_tools }}; do
            cargo install --locked "$tool"
          done

      - name: Clone source
        run: |
          REPO=$(echo '${{ matrix.build_inputs_json }}' | jq -r '.repo')
          COMMIT=$(echo '${{ matrix.build_inputs_json }}' | jq -r '.commit')
          git clone "$REPO" src/${{ matrix.package }}
          git -C src/${{ matrix.package }} checkout "$COMMIT"

      - name: Get version
        id: version
        run: |
          VERSION=$(packages/${{ matrix.package }}/recipe/get-version.sh src/${{ matrix.package }})
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package .deb
        run: |
          mkdir -p /tmp/pkg
          ./packages/${{ matrix.package }}/recipe/build.sh \
            ${{ steps.version.outputs.version }} \
            src/${{ matrix.package }} \
            /tmp/pkg \
            ${{ matrix.codename }}

      - name: sccache stats
        if: steps.config.outputs.use_sccache == 'true'
        run: sccache --show-stats

      - name: Prune sccache and check for changes
        if: steps.config.outputs.use_sccache == 'true'
        run: |
          touch -m -d "@$SCCACHE_PRUNE_TS" /tmp/sccache_prune_ref
          PRUNED=$(find "$SCCACHE_DIR" -type f ! -anewer /tmp/sccache_prune_ref | wc -l)
          find "$SCCACHE_DIR" -type f ! -anewer /tmp/sccache_prune_ref -delete
          SCCACHE_COUNT_AFTER=$(find "$SCCACHE_DIR" -type f 2>/dev/null | wc -l)
          if [ "$SCCACHE_COUNT_AFTER" != "$SCCACHE_COUNT_BEFORE" ] || [ "$PRUNED" -gt 0 ]; then
            echo "SCCACHE_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_CHANGED=false" >> "$GITHUB_ENV"
          fi

      - name: Save sccache cache
        if: steps.config.outputs.use_sccache == 'true' && env.SCCACHE_CHANGED == 'true'
        uses: actions/cache/save@v5
        with:
          path: /github/home/.cache/sccache
          key: ${{ matrix.package }}-sccache-${{ matrix.codename }}-${{ matrix.build_hash }}-${{ github.run_id }}

      - name: Publish to PPA
        uses: ./.github/actions/publish-ppa
        with:
          version: ${{ steps.version.outputs.version }}
          package: ${{ matrix.package }}
          deb_dir: /tmp/pkg
          pool_subdir: ${{ matrix.pool_subdir }}
          codename: ${{ matrix.codename }}
          arch: ${{ matrix.arch }}
          apt_signing_key: ${{ secrets.APT_SIGNING_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_hash: ${{ matrix.build_hash }}
          build_inputs_json: ${{ matrix.build_inputs_json }}
          ref: ${{ matrix.ref }}
          dry_run: ${{ github.ref != 'refs/heads/main' }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy-site
