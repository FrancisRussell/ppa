name: Update README

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/update-readme.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-readme:
    name: Compile README to HTML
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install python3-markdown
        run: |
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-markdown python3-pygments

      - name: Compile README.md to index.html
        run: |
          BODY=$(python3 -m markdown -x extra -x codehilite README.md)
          HIGHLIGHT_CSS=$(pygmentize -S default -f html -a .codehilite)
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
            <style>$HIGHLIGHT_CSS</style>
          </head>
          <body>
          $BODY
          </body></html>
          EOF

      - name: Push index.html to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if ! git clone "$REPO_URL" --branch gh-pages gh-pages-work; then
            echo "gh-pages does not exist yet; skipping"
            exit 0
          fi
          cp index.html gh-pages-work/index.html
          git config --global --add safe.directory "$GITHUB_WORKSPACE/gh-pages-work"
          cd gh-pages-work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit --amend -m "Update index.html from README.md"
            git push --force-with-lease origin gh-pages
          fi

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: compile-readme
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/deploy-site
