name: Build LLDAP

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if version unchanged
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - 'packages/lldap/**'
      - 'build-targets.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/lldap/**'
      - 'build-targets.yaml'
      - '.github/actions/publish-ppa/**'
      - '.github/actions/build-matrix/**'
      - 'scripts/update-repo.sh'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve lldap source
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE=$(scripts/resolve-source.sh lldap)
          VERSION=$(echo "$SOURCE" | jq -r '.ref')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine force flag
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FORCE: ${{ inputs.force || 'false' }}
        run: |
          FORCE=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FORCE="$DISPATCH_FORCE"
          elif [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            FORCE=true
          fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"

      - name: Generate build matrix
        id: matrix
        uses: ./.github/actions/build-matrix
        with:
          package: lldap
          version: ${{ steps.version.outputs.version }}
          force: ${{ steps.flags.outputs.force }}

  build:
    needs: check
    if: needs.check.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    permissions:
      contents: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /github/home/.cache/sccache
    steps:
      - name: Install bootstrap deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs ca-certificates curl

      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          apt-get install -y --no-install-recommends wget build-essential pkg-config libssl-dev \
            dpkg-dev debhelper devscripts libdistro-info-perl sccache

      - name: Restore cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lldap-cargo-${{ matrix.version }}
          restore-keys: |
            lldap-cargo-

      - name: Restore sccache cache
        uses: actions/cache/restore@v5
        with:
          path: /github/home/.cache/sccache
          key: lldap-sccache-${{ matrix.codename }}-${{ matrix.version }}-${{ github.run_id }}
          restore-keys: |
            lldap-sccache-${{ matrix.codename }}-${{ matrix.version }}-
            lldap-sccache-${{ matrix.codename }}-

      - name: Mark sccache entries for pruning
        run: |
          SCCACHE_PRUNE_TS=$(date +%s)
          echo "SCCACHE_PRUNE_TS=$SCCACHE_PRUNE_TS" >> "$GITHUB_ENV"
          mkdir -p "$SCCACHE_DIR"
          SCCACHE_COUNT=$(find "$SCCACHE_DIR" -type f | wc -l)
          echo "SCCACHE_COUNT_BEFORE=$SCCACHE_COUNT" >> "$GITHUB_ENV"
          find "$SCCACHE_DIR" -type f -exec touch -m -d "@$SCCACHE_PRUNE_TS" {} +

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable

      - name: Clone LLDAP source
        run: |
          git clone --branch ${{ matrix.version }} --depth 1 \
            https://github.com/lldap/lldap src/lldap

      - name: Install Rust toolchain + wasm target
        run: |
          . "$HOME/.cargo/env"
          cd src/lldap
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          . "$HOME/.cargo/env"
          cargo install --locked wasm-pack

      - name: Build LLDAP
        run: |
          . "$HOME/.cargo/env"
          cd src/lldap
          ./app/build.sh
          while IFS= read -r f; do wget -P app/static "$f"; done < app/static/libraries.txt
          while IFS= read -r f; do wget -P app/static/fonts "$f"; done < app/static/fonts/fonts.txt
          cargo build --release \
            --package lldap \
            --package lldap_migration_tool \
            --package lldap_set_password

      - name: sccache stats
        run: sccache --show-stats

      - name: Prune sccache and check for changes
        run: |
          touch -m -d "@$SCCACHE_PRUNE_TS" /tmp/sccache_prune_ref
          PRUNED=$(find "$SCCACHE_DIR" -type f ! -anewer /tmp/sccache_prune_ref | wc -l)
          find "$SCCACHE_DIR" -type f ! -anewer /tmp/sccache_prune_ref -delete
          SCCACHE_COUNT_AFTER=$(find "$SCCACHE_DIR" -type f 2>/dev/null | wc -l)
          if [ "$SCCACHE_COUNT_AFTER" != "$SCCACHE_COUNT_BEFORE" ] || [ "$PRUNED" -gt 0 ]; then
            echo "SCCACHE_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_CHANGED=false" >> "$GITHUB_ENV"
          fi

      - name: Save sccache cache
        if: env.SCCACHE_CHANGED == 'true'
        uses: actions/cache/save@v5
        with:
          path: /github/home/.cache/sccache
          key: lldap-sccache-${{ matrix.codename }}-${{ matrix.version }}-${{ github.run_id }}

      - name: Package .deb
        run: |
          mkdir -p /tmp/lldap-pkg
          ./packages/lldap/recipe/build.sh \
            ${{ matrix.version }} \
            src/lldap \
            /tmp/lldap-pkg \
            ${{ matrix.codename }}

      - name: Publish to PPA
        uses: ./.github/actions/publish-ppa
        with:
          version: ${{ matrix.version }}
          package: lldap
          deb_dir: /tmp/lldap-pkg
          pool_subdir: l/lldap
          codename: ${{ matrix.codename }}
          arch: ${{ matrix.arch }}
          apt_signing_key: ${{ secrets.APT_SIGNING_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: ${{ github.ref != 'refs/heads/main' }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy-site
